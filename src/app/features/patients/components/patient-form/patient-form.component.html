<form class="patient-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label for="name">{{ 'patients.fullName' | t }}</label>
    <input id="name" type="text" formControlName="name" class="native-input" [placeholder]="'patients.namePlaceholder' | t" />
  </div>
  <div class="field">
    <label for="phone">{{ 'common.phone' | t }}</label>
    <input id="phone" type="text" dir="ltr" formControlName="phone" class="native-input" placeholder="e.g. +201000000000" />
  </div>
  <div class="field">
    <label for="email">{{ 'common.email' | t }}</label>
    <input id="email" type="email" dir="ltr" formControlName="email" class="native-input" [placeholder]="'patients.emailPlaceholder' | t" />
  </div>
  <div class="field">
    <label for="dateOfBirth">{{ 'patients.dateOfBirth' | t }}</label>
    <input id="dateOfBirth" type="date" formControlName="dateOfBirth" class="native-input" />
  </div>
  <div class="field">
    <label for="medicalNotes">{{ 'patients.medicalNotes' | t }}</label>
    <textarea id="medicalNotes" formControlName="medicalNotes" class="notes-input" rows="3"></textarea>
  </div>

  @if (saveError) {
    <p class="form-error">{{ saveError }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="submit-btn" [disabled]="isSaving">{{ submitLabel | t }}</button>
  </div>
</form>
