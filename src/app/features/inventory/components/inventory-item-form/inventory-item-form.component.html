<form class="item-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label for="name">{{ 'inventory.itemName' | t }}</label>
    <input id="name" type="text" formControlName="name" class="native-input" [placeholder]="'inventory.itemNamePlaceholder' | t" />
  </div>

  <div class="field-row">
    <div class="field">
      <label for="category">{{ 'common.category' | t }}</label>
      <select id="category" formControlName="category" class="native-select">
        @for (category of categories; track category) {
          <option [value]="category">{{ ('inventory.category.' + category) | t }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="unit">{{ 'inventory.unit' | t }}</label>
      <input id="unit" type="text" formControlName="unit" class="native-input" [placeholder]="'inventory.unitPlaceholder' | t" />
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="quantityInStock">{{ 'inventory.quantityInStock' | t }}</label>
      <input
        id="quantityInStock"
        type="number"
        min="0"
        step="0.01"
        formControlName="quantityInStock"
        class="native-input"
      />
    </div>
    <div class="field">
      <label for="lowStockThreshold">{{ 'inventory.lowStockThreshold' | t }}</label>
      <input
        id="lowStockThreshold"
        type="number"
        min="0"
        step="0.01"
        formControlName="lowStockThreshold"
        class="native-input"
      />
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="unitCost">{{ 'inventory.unitCost' | t }}</label>
      <input id="unitCost" type="number" min="0" step="0.01" formControlName="unitCost" class="native-input" />
    </div>
    <div class="field">
      <label for="expiryDate">{{ 'inventory.expiryDateOptional' | t }}</label>
      <input id="expiryDate" type="date" formControlName="expiryDate" class="native-input" />
    </div>
  </div>

  @if (saveError) {
    <p class="form-error">{{ saveError }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="submit-btn" [disabled]="isSaving">{{ submitLabel | t }}</button>
  </div>
</form>
